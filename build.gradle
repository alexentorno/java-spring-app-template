plugins {
    id 'java'
    id 'org.gretty' version '4.1.5'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.postgresql',
            name: 'postgresql',
            version: '42.7.3'

    implementation group: 'org.apache.commons',
            name: 'commons-dbcp2',
            version: '2.12.0'


    implementation group: 'org.apache.logging.log4j',
            name: 'log4j-api',
            version: '2.23.1'

    implementation group: 'org.apache.logging.log4j',
            name: 'log4j-core',
            version: '2.23.1'

    compileOnly group: 'jakarta.servlet',
            name: 'jakarta.servlet-api',
            version: '6.1.0'

    compileOnly group: 'org.projectlombok',
            name: 'lombok',
            version: '1.18.34'

    annotationProcessor group: 'org.projectlombok',
            name: 'lombok',
            version: '1.18.34'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.5'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.13.5'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

gretty {
    servletContainer = 'jetty11'
    contextPath = '/'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


